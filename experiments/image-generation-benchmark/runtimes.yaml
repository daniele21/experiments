providers:
  openai-image:
    type: openai-image
    api_key_env: OPENAI_API_KEY

  gemini-image:
    type: gemini-image
    api_key_env: GEMINI_API_KEY

runtimes:
  openai-image-api:
    provider: openai-image
    deployment: api
    transport:
      max_retries: 2
      timeout_seconds: 180

  gemini-image-api:
    provider: gemini-image
    deployment: api
    transport:
      max_retries: 2
      timeout_seconds: 180
