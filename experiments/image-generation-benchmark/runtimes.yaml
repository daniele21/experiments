providers:
  openai-image:
    type: openai-image
    api_key_env: OPENAI_API_KEY

  gemini-image:
    type: gemini-image
    api_key_env: GEMINI_API_KEY

  korgis-image:
    type: korgis-image
    base_url_env: KORGIS_BASE_URL
    api_key_env: KORGIS_API_KEY

runtimes:
  openai-image-api:
    provider: openai-image
    deployment: api
    transport:
      max_retries: 2
      timeout_seconds: 180

  gemini-image-api:
    provider: gemini-image
    deployment: api
    transport:
      max_retries: 2
      timeout_seconds: 180

  korgis-image-local:
    provider: korgis-image
    deployment: local
    transport:
      max_retries: 1
      timeout_seconds: 900
