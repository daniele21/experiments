[project]
name = "diarization-bench"
version = "0.1.0"
description = "Reproducible local speaker-diarization benchmark for Apple Silicon"
requires-python = ">=3.11"
dependencies = [
  "pyyaml>=6.0.3",
  "psutil>=6.0",
  "scipy>=1.13",
]

[project.scripts]
diarization-bench = "diarization_bench.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.12"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/diarization_bench"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["src"]
