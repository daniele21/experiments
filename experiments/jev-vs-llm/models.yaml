providers:
  korgis:
    type: openai-compatible
    base_url_env: KORGIS_BASE_URL
    required_env:
      - KORGIS_BASE_URL
    options:
      protocol: chat-completions
      local_provider_fee: 0

runtimes:
  korgis-local:
    provider: korgis
    deployment: local
    lifecycle: managed
    options:
      runtime_type: korgis

models:
  qwen3.5-0.8b-q4km:
    model_id: unsloth/qwen3.5-0.8b
    runtime_model_id: qwen3.5-0.8b-q4km
    runtime: korgis-local
    family: qwen3.5
    parameters_b: 0.8
    artifact:
      format: gguf
      quantization: Q4_K_M
      metadata:
        resolved_by: external-korgis-registry
    tags: [local-benchmark, qwen, small]

