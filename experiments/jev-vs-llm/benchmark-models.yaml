# benchmark-models.yaml
# Dedicated external registry for local LM Studio models used in Jev vs LLM benchmarks.
#
# Usage:
#   export LOCAL_LLM_REGISTRY_PATHS="/Users/moltisantid/Personal/experiments/experiments/jev-vs-llm/benchmark-models.yaml"
#   cd /Users/moltisantid/Personal/experiments/korgis
#   uv run --frozen local-llm models
#   uv run --frozen local-llm serve --model nemotron-nano-4b --enable-admin-api --no-download

models:
  qwen3.5-0.8b-q4km:
    path: "/Users/moltisantid/.lmstudio/models/unsloth/Qwen3.5-0.8B-GGUF/Qwen3.5-0.8B-Q4_K_M.gguf"
    model_id: "unsloth/qwen3.5-0.8b"
    quantization: "Q4_K_M"
    backend: llama_server
    thinking_mode: none
    params:
      ctx_size: 8192
      startup_timeout: 300
      max_concurrent_requests: 1
      default_temperature: 0.0
      enable_thinking: false
      show_thinking: false
    tags: [local-benchmark, qwen, 0.8b]

