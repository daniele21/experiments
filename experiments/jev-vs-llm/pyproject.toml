[project]
name = "jev-bench"
version = "0.1.0"
description = "Reproducible Jev vs LLM decision benchmark"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "openai>=1.0",
  "pandas>=2.2",
  "plotly>=6.0",
  "typesafe-sdk>=0.7.0",
  "typer>=0.16",
  "pyyaml>=6.0.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.12"]

[project.scripts]
jev-bench = "jev_bench.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jev_bench"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["src"]
