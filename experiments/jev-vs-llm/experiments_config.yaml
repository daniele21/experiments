# Configuration for the autonomous local Jev benchmark runner.
#
# Machine-specific paths are intentionally not committed. Configure:
#   KORGIS_DIR=/path/to/korgis
#   LOCAL_LLM_REGISTRY_PATHS=/path/to/your/local-korgis-model-registry.yaml
# when Korgis must be started by this runner.

benchmark_registry_path: "models.yaml"

korgis_base_url: "http://127.0.0.1:1235/v1"
korgis_control_timeout: 360

default_models:
  - "nemotron-nano-4b"
  - "nemotron-nano-4b-q8"
  - "qwen3.5-9b-q4km"
  - "qwen3.5-2b-q4km"

default_experiments:
  - "routing"

dataset: "smoke"
public_profile: "budget"
max_output_tokens: 512

results_csv: "results/raw/local_results.csv"
report_html: "results/local_report.html"

stop_korgis_on_complete: true
log_level: "INFO"
