# Unified model/runtime/provider registry for model-capability-benchmark.
#
# Secrets and machine-specific paths MUST NOT be committed here.
# Environment variables are resolved during preflight/runtime construction.

providers:
  korgis:
    type: openai-compatible
    base_url_env: KORGIS_BASE_URL
    required_env:
      - KORGIS_BASE_URL
    options:
      protocol: chat-completions
      local_provider_fee: 0

  openai:
    type: openai
    api_key_env: OPENAI_API_KEY
    required_env:
      - OPENAI_API_KEY
    options:
      protocol: responses

  minicpm-modelbest:
    type: openai-compatible
    base_url_env: MINICPM_BASE_URL
    api_key_env: MINICPM_API_KEY
    required_env:
      - MINICPM_API_KEY
    options:
      protocol: chat-completions
      default_base_url: https://api.modelbest.cn/v1

  typesafe:
    type: typesafe
    api_key_env: TYPESAFE_API_KEY
    required_env:
      - TYPESAFE_API_KEY
    options:
      protocol: system-one

  decisio:
    type: decisio
    options:
      protocol: decisio-engine


runtimes:
  korgis-local:
    provider: korgis
    deployment: local
    lifecycle: managed
    options:
      runtime_type: korgis
      control_timeout_env: KORGIS_CONTROL_TIMEOUT_SECONDS

  openai-api:
    provider: openai
    deployment: api
    lifecycle: external
    options:
      runtime_type: provider-api

  minicpm-api:
    provider: minicpm-modelbest
    deployment: api
    lifecycle: external
    options:
      runtime_type: provider-api

  typesafe-api:
    provider: typesafe
    deployment: api
    lifecycle: external
    options:
      runtime_type: provider-api

  decisio-local:
    provider: decisio
    deployment: local
    lifecycle: external
    options:
      runtime_type: provider-api


