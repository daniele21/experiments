datasets:
  banking77:
    version: "1"
    adapter: banking77
    source: PolyAI-LDN/task-specific-datasets
    revision: 9d081458ff52e53cf7e848f414e6e9344e4e6696
    split: test
    license: CC-BY-4.0
    sample_schema_version: "1"
    cache_mode: download
    options:
      timeout_seconds: 60
      user_agent: model-capability-bench/0.1
      sampling: class-balanced
      files:
        test:
          url: https://raw.githubusercontent.com/PolyAI-LDN/task-specific-datasets/9d081458ff52e53cf7e848f414e6e9344e4e6696/banking_data/test.csv
          cache_path: banking77/test.csv
        categories:
          url: https://raw.githubusercontent.com/PolyAI-LDN/task-specific-datasets/9d081458ff52e53cf7e848f414e6e9344e4e6696/banking_data/categories.json
          cache_path: banking77/categories.json

  clinc150-oos:
    version: "1"
    adapter: clinc150-oos
    source: clinc/oos-eval
    revision: 48a0e1cff8f43dd4d0836ecb4ed5df08733e3d2e
    split: oos_test
    license: CC-BY-3.0
    sample_schema_version: "1"
    cache_mode: download
    options:
      timeout_seconds: 60
      user_agent: model-capability-bench/0.1
      file:
        url: https://raw.githubusercontent.com/clinc/oos-eval/48a0e1cff8f43dd4d0836ecb4ed5df08733e3d2e/data/data_full.json
        cache_path: clinc150/data_full.json
      expected_label: other
      exclude_terms:
        - account
        - atm
        - bank
        - banking
        - balance
        - card
        - cash
        - charge
        - credit
        - currency
        - debit
        - deposit
        - exchange
        - fee
        - finance
        - loan
        - money
        - payment
        - refund
        - top up
        - transaction
        - transfer
        - wire
        - withdraw
        - withdrawal

  structured-output-controlled-v1:
    version: "1"
    adapter: structured-output-controlled
    source: repository-authored
    revision: v1
    split: controlled
    license: repository-authored
    sample_schema_version: "1"
    cache_mode: repository
    options:
      path: data/structured-output-controlled-v1.yaml


  qa-abstention-controlled-v1:
    version: "1"
    adapter: controlled-yaml
    source: repository-authored
    revision: v1
    split: controlled
    license: repository-authored
    sample_schema_version: "1"
    cache_mode: repository
    options:
      path: data/qa-abstention-controlled-v1.yaml

  math-reasoning-controlled-v1:
    version: "1"
    adapter: controlled-yaml
    source: repository-authored
    revision: v1
    split: controlled
    license: repository-authored
    sample_schema_version: "1"
    cache_mode: repository
    options:
      path: data/math-reasoning-controlled-v1.yaml


  structured-output-controlled-v2:
    version: "2"
    adapter: structured-output-controlled
    source: repository-authored
    revision: v2
    split: controlled
    license: repository-authored
    sample_schema_version: "2"
    cache_mode: repository
    options:
      path: data/structured-output-controlled-v2.yaml
      human_reviewed: false
      difficulty_labels: authored-provisional

  qa-abstention-controlled-v2:
    version: "2"
    adapter: controlled-yaml
    source: repository-authored
    revision: v2
    split: controlled
    license: repository-authored
    sample_schema_version: "2"
    cache_mode: repository
    options:
      path: data/qa-abstention-controlled-v2.yaml
      human_reviewed: false
      difficulty_labels: authored-provisional

  math-reasoning-controlled-v2:
    version: "2"
    adapter: controlled-yaml
    source: repository-authored
    revision: v2
    split: controlled
    license: repository-authored
    sample_schema_version: "2"
    cache_mode: repository
    options:
      path: data/math-reasoning-controlled-v2.yaml
      human_reviewed: false
      difficulty_labels: authored-provisional

  math-reasoning-controlled-v3:
    version: "3"
    adapter: controlled-yaml
    source: repository-authored
    revision: v3
    split: controlled
    license: repository-authored
    sample_schema_version: "2"
    cache_mode: repository
    options:
      path: data/math-reasoning-controlled-v3.yaml
      human_reviewed: false
      difficulty_labels: authored-provisional

  # Public benchmarks: immutable Hugging Face dataset revisions and original test splits.
  gsm8k-main-test:
    version: "1"
    adapter: public-parquet
    source: openai/gsm8k
    revision: 740312add88f781978c0658806c59bc2815b9866
    split: test
    license: MIT
    sample_schema_version: "1"
    cache_mode: download
    options:
      timeout_seconds: 120
      user_agent: model-capability-bench/0.1
      file:
        url: https://huggingface.co/datasets/openai/gsm8k/resolve/740312add88f781978c0658806c59bc2815b9866/main/test-00000-of-00001.parquet
        cache_path: gsm8k/740312add88f781978c0658806c59bc2815b9866/test.parquet

  squad-v2-validation:
