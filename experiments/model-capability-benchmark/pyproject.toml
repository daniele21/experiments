[project]
name = "model-capability-bench"
version = "0.1.0"
description = "Reusable multi-model capability benchmark suite"
requires-python = ">=3.11"
dependencies = [
  "benchmark-core",
  "jsonschema>=4.23",
  "openai>=1.0",
  "pyyaml>=6.0.3",
  "duckdb>=1.2.0",
  "typesafe-sdk>=0.7.2",
]

[project.scripts]
model-bench = "model_capability_bench.cli:main"

[tool.uv.sources]
benchmark-core = { path = "../../packages/benchmark-core", editable = true }

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.12"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/model_capability_bench"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["src", "../../packages/benchmark-core/src"]
