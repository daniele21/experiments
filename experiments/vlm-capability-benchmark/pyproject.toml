[project]
name = "vlm-bench"
version = "0.1.0"
description = "Reproducible vision-language model capability benchmark"
requires-python = ">=3.11"
dependencies = [
  "benchmark-core",
  "pyyaml>=6.0.3",
  "cairosvg>=2.7",
]

[tool.uv.sources]
benchmark-core = { path = "../../packages/benchmark-core", editable = true }

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.12"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vlm_bench"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["src", "../../packages/benchmark-core/src"]
