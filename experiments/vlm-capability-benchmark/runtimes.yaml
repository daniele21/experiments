providers:
  vllm-openai-compatible:
    type: openai-compatible
    base_url_env: VLM_BASE_URL
    api_key_env: VLM_API_KEY

runtimes:
  qwen-vllm-local:
    provider: vllm-openai-compatible
    deployment: local
    lifecycle: external
    transport:
      max_retries: 2
      timeout_seconds: 120
