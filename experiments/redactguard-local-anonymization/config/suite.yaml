suite:
  dataset: data/realistic
  profiles: config/profiles.yaml
  results_dir: results

  # Managed suites use a dedicated port so they cannot accidentally reuse
  # an unrelated Korgis process already running on the normal :1235 port.
  korgis_base_url: http://127.0.0.1:12435/v1

  models:
    - nemotron-nano-4b
    - nemotron-nano-4b-q8
    - qwen3.5-4b-q4km
    - qwen3.5-9b-q4km

  # The suite runs "local-llm download <model>" from the Korgis repository
  # before benchmarking. Already downloaded artifacts are reused by Korgis.
  ensure_models: true
  korgis_startup_timeout_seconds: 600

  # Every model gets its own fresh Korgis process. This prevents resident
  # runtimes from accumulating and makes cross-model memory state comparable.
  runtime_strategy: restart_per_model

  quality_warmups: 1

  latency:
    case_ids:
      - lettera.txt
      - presentazione.pptx
      - contratto.pdf
    warmups: 5
    repeats: 30
