# Benchmark-specific label contracts, intentionally separate from production profiles.
# Scores from these adapted prompt profiles are NOT production RedactGuard scores.
source:
  repository: daniele21/redact-guard
  ref: ab8855a3d644c479b00a4dc3e5d7b5f949f4f5b1
  contract_version: redactguard-detection-v2
  output_schema: minimal-pii-type-value-v1
  benchmark_profile_version: medical-gold-v1
profiles:
  asq_phi:
    name:
      description: Person's full or abbreviated name in clinical search requests.
    geographic_location:
      description: Named location, clinic, hospital, healthcare facility or geographically identifying information in a patient query, matching ASQ-PHI HIPAA location labeling.
    date:
      description: Specific event/encounter/admission/birth date linked to a patient or their record; not generic years without identifying context.
    medical_record_number:
      description: Specific patient medical record number (MRN).
    health_plan_beneficiary_number:
      description: Patient's health insurance or plan beneficiary number.
    phone_number:
      description: Patient or provider phone number.
    social_security_number:
      description: Social security number identifying a person.
    email_address:
      description: Email identifying a person or their healthcare contact.
    unique_identifier:
      description: Unique identifier of a patient or health record.
    account_number:
      description: Account number linked to the patient's record.
    fax_number:
      description: Fax number in the clinical request.
    certificate_license_number:
      description: Professional certificate or licence number that can identify a person.
    ip_address:
      description: Identifying IP address in the clinical request.
  meddocan_phi:
    med_name:
      description: Names of patients or healthcare staff, including abbreviated names.
    med_date:
      description: Exact patient-related dates.
    med_age:
      description: Explicitly annotated patient age, even under 90, under MEDDOCAN policy.
    med_location:
      description: Hospital, clinic, street, city, institution, country or specific location named in a clinical case.
    med_contact:
      description: Phone, fax, email, URL or network contact detail.
    med_id:
      description: Patient and provider IDs, healthcare episode identifiers, insurance, licence, device or other record identifiers.
    med_profession:
      description: Occupation or profession when annotated in the clinical case.
    med_other:
      description: Patient gender, family relationships, and other health-record-sensitive personal attributes according to MEDDOCAN guidelines.
  spaccc_clinical_ner:
    clinical_disease:
      description: Identify every clinically annotated disease/disorder mention in Spanish clinical narratives, even without a patient name. Not an anonymization label.
    clinical_symptom:
      description: Identify every symptom, clinical sign, or finding in Spanish clinical narratives, including absent/negative findings where explicit.
    clinical_procedure:
      description: Identify every medical examination, diagnostic or therapeutic procedure described in the clinical text. This is a PROCEDURE label, not necessarily a medication.
    clinical_chemical:
      description: Identify chemical or pharmacological substance mentions under the SPACCC CHEMICAL taxonomy. Do NOT assume every chemical is a patient's medication.
    clinical_protein:
      description: Identify protein mentions under the SPACCC PROTEIN taxonomy.
  e3c_clinical_ner:
    e3c_clinical_entity:
      description: Identify E3C/UMLS clinical disorders including pathologies and symptoms, even without identifiable patients. Do not infer a more granular diagnosis from the entity alone.
    e3c_body_part:
      description: Identify mentions of parts of the human body annotated by E3C BODYPART.
    e3c_measurement:
      description: Identify E3C numeric or textual RML results and measurements as written, without generating values.
    e3c_actor:
      description: Identify all E3C ACTOR mentions referring to a patient, clinical professional, another human or animal, including generic patient references. ACTOR is not an identity/PHI judgment.
  clinical_ner:
    clinical_drug:
      description: EVERY mention of a drug or medicinal product, including generic drug names in pharmaceutical leaflets. This is clinical NER, NOT a personal data test.
    clinical_disease:
      description: EVERY mention of a disease or diagnosed medical condition, whether patient-linked or generic. Clinical NER only.
    clinical_symptom:
      description: EVERY mention of a symptom or clinical sign, including generic descriptions. Clinical NER only.
    clinical_anatomical_part:
      description: EVERY mention of a human anatomical part. Clinical NER only.
