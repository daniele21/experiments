suite:
  dataset: data/challenge/cases.jsonl
  profiles: config/profiles.yaml
  results_dir: results

  korgis_base_url: http://127.0.0.1:12435/v1

  models:
    - nemotron-nano-4b
    - nemotron-nano-4b-q8
    - qwen3.5-4b-q4km
    - qwen3.5-9b-q4km

  ensure_models: true
  korgis_startup_timeout_seconds: 600
  runtime_strategy: restart_per_model
  quality_warmups: 1

  benchmark_timeout_seconds: 360
  chunk_max_chars: 4000
  chunk_overlap_chars: 256
  max_output_tokens: 4096
  adaptive_subdivision: true
  min_split_chars: 500

  latency:
    case_ids:
      - gc01-pos
      - hc03-pos
      - fc03-pos
      - lc01-pos
    warmups: 3
    repeats: 15
