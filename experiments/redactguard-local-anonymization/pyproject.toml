[project]
name = "redact-bench"
version = "0.1.0"
description = "Reproducible local anonymization benchmark for RedactGuard through Korgis"
requires-python = ">=3.11"
dependencies = [
  "openai>=1.0",
  "pyyaml>=6.0",
  "typer>=0.16",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.12"]

[project.scripts]
redact-bench = "redact_bench.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/redact_bench"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["src"]
