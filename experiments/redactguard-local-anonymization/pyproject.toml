[project]
name = "redact-bench"
version = "0.2.0"
description = "Reproducible local anonymization benchmark for RedactGuard through Korgis"
requires-python = ">=3.11"
dependencies = [
  "openai>=1.0",
  "pyyaml>=6.0",
  "typer>=0.16",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.12"]
documents = [
  "docling>=2.0.0",
  "reportlab>=4.0",
]

[project.scripts]
redact-bench = "redact_bench.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/redact_bench"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Keep CI focused on correctness/unused-code checks. Typer intentionally uses
# callable Option defaults and provider boundaries intentionally capture failures.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
pythonpath = ["src"]
