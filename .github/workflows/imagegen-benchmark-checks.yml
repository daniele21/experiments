name: Image generation benchmark checks

on:
  pull_request:
    paths:
      - "experiments/image-generation-benchmark/**"
      - "packages/benchmark-core/**"
      - ".github/workflows/imagegen-benchmark-checks.yml"
  workflow_dispatch:

jobs:
  imagegen-foundation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experiments/image-generation-benchmark

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv

      - name: Sync dependencies
        run: uv sync --extra dev

      - name: Ruff
        run: uv run ruff check src tests

      - name: Tests
        run: uv run pytest
