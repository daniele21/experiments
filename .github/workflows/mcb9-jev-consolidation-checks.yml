name: MCB-9 Jev consolidation checks

on:
  pull_request:
    paths:
      - "packages/benchmark-core/**"
      - "experiments/jev-vs-llm/**"
      - "experiments/model-capability-benchmark/**"
      - ".github/workflows/mcb9-jev-consolidation-checks.yml"
  workflow_dispatch:

jobs:
  jev-consolidation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experiments/jev-vs-llm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv

      - name: Sync Jev dependencies
        run: uv sync --frozen --extra dev

      - name: Ruff consolidation paths
        run: >
          uv run ruff check
          ../../packages/benchmark-core/src/benchmark_core/datasets
          ../../packages/benchmark-core/tests/test_datasets.py
          src/jev_bench/benchmark_data.py
          src/jev_bench/decision_task.py
          src/jev_bench/runner.py
          scripts/run_local_matrix.py
          scripts/korgis_manager.py
          tests/test_public_data.py
          tests/test_portable_registry.py
          tests/test_decision_task_adapter.py

      - name: Compile consolidation paths
        run: >
          uv run python -m compileall -q
          ../../packages/benchmark-core/src/benchmark_core/datasets
          src/jev_bench
          scripts/run_local_matrix.py
          scripts/korgis_manager.py

      - name: Shared dataset parser tests
        run: >
          uv run pytest -c pyproject.toml
          ../../packages/benchmark-core/tests/test_datasets.py

      - name: Jev migration regression tests
        run: >
          uv run pytest
          tests/test_public_data.py
          tests/test_portable_registry.py
          tests/test_decision_task_adapter.py
          tests/test_characterization_contracts.py

      - name: Assert portable registry split
        run: |
          test -f models.yaml
          test -f datasets.yaml
          test ! -e benchmark-models.yaml
          ! grep -R "/Users/" models.yaml datasets.yaml experiments_config.yaml

      - name: Full Jev suite
        run: |
          if [ -f dashboard/package-lock.json ]; then
            npm --prefix dashboard ci
          fi
          uv run pytest
