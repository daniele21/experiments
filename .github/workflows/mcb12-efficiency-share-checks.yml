name: MCB-12 efficiency telemetry and share renderer checks

on:
  pull_request:
    paths:
      - "packages/benchmark-core/**"
      - "experiments/model-capability-benchmark/**"
      - ".github/workflows/mcb12-efficiency-share-checks.yml"
  workflow_dispatch:

jobs:
  telemetry-share:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experiments/model-capability-benchmark

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: experiments/model-capability-benchmark/dashboard/package-lock.json

      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv

      - name: Sync Python dependencies
        run: uv sync --extra dev

      - name: Ruff MCB-12
        run: >
          uv run ruff check
          src/model_capability_bench/telemetry
          src/model_capability_bench/runtimes/korgis.py
          src/model_capability_bench/runner/evidence.py
          src/model_capability_bench/runner/engine.py
          src/model_capability_bench/analytics
          src/model_capability_bench/sharing
          tests/test_resource_telemetry.py
          tests/test_runtime_providers.py
          tests/test_projector.py
          tests/test_share_renderer.py

      - name: Compile MCB-12
        run: >
          uv run python -m compileall -q
          src/model_capability_bench/telemetry
          src/model_capability_bench/analytics
          src/model_capability_bench/sharing

      - name: MCB-12 Python tests
        run: >
          uv run pytest
          tests/test_resource_telemetry.py
          tests/test_runtime_providers.py
          tests/test_projector.py
          tests/test_share_renderer.py
          tests/test_dashboard_build.py

      - name: Install dashboard dependencies
        working-directory: experiments/model-capability-benchmark/dashboard
        run: npm ci

      - name: Lint dashboard
        working-directory: experiments/model-capability-benchmark/dashboard
        run: npm run lint

      - name: Build dashboard
        working-directory: experiments/model-capability-benchmark/dashboard
        run: npm run build

      - name: Render real share assets with Chrome
        run: |
          CHROME="$(command -v google-chrome || command -v chromium || true)"
          test -n "$CHROME"
          rm -rf /tmp/mcb-share
          mkdir -p /tmp/mcb-share
          cp tests/fixtures/share_snapshot.json /tmp/mcb-share/snapshot.json
          CHROME_BIN="$CHROME" uv run python - <<'PY'
          from pathlib import Path
          from model_capability_bench.sharing import render_share_snapshot

          root = Path("/tmp/mcb-share")
          result = render_share_snapshot(snapshot_path=root / "snapshot.json")
          assert len(result.png_paths) == 5
          for raw in result.png_paths:
              data = Path(raw).read_bytes()
              assert data[:8] == b"\x89PNG\r\n\x1a\n"
              assert int.from_bytes(data[16:20], "big") == 1080
              assert int.from_bytes(data[20:24], "big") == 1350
          assert result.pdf_path is not None
          assert Path(result.pdf_path).read_bytes().startswith(b"%PDF")
          PY

      - name: Upload visual review artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mcb12-share-renderer
          path: |
            /tmp/mcb-share/card-*.png
            /tmp/mcb-share/carousel.pdf
          if-no-files-found: error
