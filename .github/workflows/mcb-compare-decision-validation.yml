name: MCB Compare decision validation

on:
  push:
    branches:
      - feat/mcb-compare-decision-intelligence
      - feat/mcb-compare-optional-third-model
      - feat/mcb-hardware-memory-compare
      - main
    paths:
      - ".github/workflows/mcb-compare-decision-validation.yml"
      - "experiments/model-capability-benchmark/dashboard/**"
      - "experiments/model-capability-benchmark/src/model_capability_bench/analytics/**"
      - "experiments/model-capability-benchmark/tests/test_decision_memory.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mcb-compare-decision-validation
  cancel-in-progress: true

jobs:
  compare-build:
    name: Typecheck, lint and bundle
    runs-on: [self-hosted, macOS, ARM64, mac-pool]
    timeout-minutes: 15
    defaults:
      run:
        working-directory: experiments/model-capability-benchmark/dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: experiments/model-capability-benchmark/dashboard/package-lock.json
      - name: Verify Python resource aggregation
        working-directory: experiments/model-capability-benchmark
        run: |
          uv run ruff check src/model_capability_bench/analytics/decision_summary.py tests/test_decision_memory.py
          uv run pytest -q tests/test_decision_memory.py
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: npm ci
      - run: npm run test:compare
      - run: npm run lint
      - run: npm run build
      - run: test -s dist/index.html
