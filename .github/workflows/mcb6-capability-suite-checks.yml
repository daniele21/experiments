name: MCB-6 capability suite checks

on:
  pull_request:
    paths:
      - "packages/benchmark-core/**"
      - "experiments/model-capability-benchmark/**"
      - ".github/workflows/mcb6-capability-suite-checks.yml"
  workflow_dispatch:

jobs:
  capability-suite:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experiments/model-capability-benchmark

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv

      - name: Sync dependencies
        run: uv sync --extra dev

      - name: Ruff capability suite
        run: >
          uv run ruff check
          ../../packages/benchmark-core/src
          ../../packages/benchmark-core/tests
          src
          tests
          scripts/suite_inspect.py

      - name: Compile capability suite
        run: >
          uv run python -m compileall -q
          ../../packages/benchmark-core/src/benchmark_core/suites
          src/model_capability_bench
          scripts/suite_inspect.py

      - name: Capability suite tests
        run: >
          uv run pytest
          ../../packages/benchmark-core/tests/test_suites.py
          tests/test_capability_suite.py
          tests/test_task_plugins.py
          tests/test_dataset_adapters.py

      - name: Plan local and API capability matrix
        run: >
          uv run python scripts/suite_inspect.py
          --models qwen3.5-2b-q4km,gpt-5.6-luna
          --capabilities all
