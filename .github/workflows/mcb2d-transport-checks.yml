name: MCB-2D transport checks

on:
  pull_request:
    paths:
      - "packages/benchmark-core/**"
      - "experiments/jev-vs-llm/src/jev_bench/providers/**"
      - "experiments/jev-vs-llm/tests/test_clm_provider.py"
      - "experiments/jev-vs-llm/tests/test_korgis_provider.py"
      - "experiments/jev-vs-llm/tests/test_minicpm_provider.py"
      - "experiments/model-capability-benchmark/**"
      - ".github/workflows/mcb2d-transport-checks.yml"
  workflow_dispatch:

jobs:
  transports:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experiments/jev-vs-llm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv

      - name: Frozen dependency sync
        run: uv sync --extra dev --frozen

      - name: Ruff transport extraction
        run: >
          uv run --frozen ruff check
          ../../packages/benchmark-core/src
          ../../packages/benchmark-core/tests
          src/jev_bench/providers/openai.py
          src/jev_bench/providers/minicpm.py
          src/jev_bench/providers/korgis.py
          src/jev_bench/providers/clm.py
          tests/test_clm_provider.py

      - name: Compile providers
        run: >
          uv run --frozen python -m compileall -q
          src/jev_bench/providers

      - name: Transport and provider compatibility tests
        run: >
          uv run --frozen pytest -c pyproject.toml
          ../../packages/benchmark-core/tests/test_transports.py
          tests/test_clm_provider.py
          tests/test_korgis_provider.py
          tests/test_minicpm_provider.py
