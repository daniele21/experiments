name: MCB-5 dataset registry checks

on:
  pull_request:
    paths:
      - "packages/benchmark-core/**"
      - "experiments/model-capability-benchmark/**"
      - ".github/workflows/mcb5-dataset-registry-checks.yml"
  workflow_dispatch:

jobs:
  datasets:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experiments/model-capability-benchmark

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv

      - name: Sync dependencies
        run: uv sync --extra dev

      - name: Ruff dataset framework
        run: >
          uv run ruff check
          ../../packages/benchmark-core/src
          ../../packages/benchmark-core/tests
          src
          tests
          scripts/dataset_inspect.py

      - name: Compile dataset framework
        run: >
          uv run python -m compileall -q
          ../../packages/benchmark-core/src/benchmark_core/datasets
          src/model_capability_bench/datasets
          scripts/dataset_inspect.py

      - name: Dataset registry and adapter tests
        run: >
          uv run pytest
          ../../packages/benchmark-core/tests/test_datasets.py
          tests/test_dataset_adapters.py

      - name: Inspect dataset catalog without network
        run: uv run python scripts/dataset_inspect.py --datasets all --profile smoke

      - name: Load repository-authored controlled dataset
        run: >
          uv run python scripts/dataset_inspect.py
          --datasets structured-output-controlled-v1
          --profile smoke
          --load
