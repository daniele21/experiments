name: MCB-0 characterization checks

on:
  pull_request:
    paths:
      - "experiments/jev-vs-llm/**"
      - "experiments/model-capability-benchmark/**"
      - ".github/workflows/mcb0-characterization-checks.yml"
  workflow_dispatch:

jobs:
  characterization:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experiments/jev-vs-llm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Ruff changed characterization tests
        run: >
          uv run ruff check
          tests/test_characterization_contracts.py
          tests/test_public_data.py

      - name: Install dashboard dependencies
        run: npm ci --prefix dashboard

      - name: Full unit test suite
        run: uv run pytest
