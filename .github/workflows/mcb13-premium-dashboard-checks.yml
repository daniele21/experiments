name: MCB-13 premium decision dashboard checks

on:
  pull_request:
    paths:
      - "experiments/model-capability-benchmark/**"
      - ".github/workflows/mcb13-premium-dashboard-checks.yml"
  workflow_dispatch:

jobs:
  premium-dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experiments/model-capability-benchmark

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: experiments/model-capability-benchmark/dashboard/package-lock.json

      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv

      - name: Sync Python dependencies
        run: uv sync --extra dev

      - name: Ruff decision analytics
        run: >
          uv run ruff check
          src/model_capability_bench/analytics
          tests/test_projector.py
          tests/test_dashboard_build.py
          tests/test_decision_costs.py

      - name: Compile decision analytics
        run: >
          uv run python -m compileall -q
          src/model_capability_bench/analytics

      - name: Projection tests
        run: >
          uv run pytest
          tests/test_projector.py
          tests/test_dashboard_build.py
          tests/test_decision_costs.py

      - name: Install dashboard dependencies
        working-directory: experiments/model-capability-benchmark/dashboard
        run: npm ci

      - name: Lint dashboard
        working-directory: experiments/model-capability-benchmark/dashboard
        run: npm run lint

      - name: Build dashboard
        working-directory: experiments/model-capability-benchmark/dashboard
        run: npm run build

      - name: Render premium routes with Chrome
        run: |
          CHROME="$(command -v google-chrome || command -v chromium || true)"
          test -n "$CHROME"
          HTML="$(pwd)/dashboard/dist/index.html"
          for route in overview capabilities/structured-output compare executive/scorecard executive/quality executive/speed executive/size executive/cost executive/capabilities executive/dataset-fit executive/reliability; do
            name="$(echo "$route" | tr '/' '-')"
            "$CHROME" \
              --headless \
              --no-sandbox \
              --disable-gpu \
              --hide-scrollbars \
              --window-size=1600,1000 \
              --screenshot="/tmp/mcb13-$name-1600.png" \
              "file://$HTML#/$route"
            test -s "/tmp/mcb13-$name-1600.png"
          done

          for spec in "1280,1100" "1024,1200"; do
            width="${spec%%,*}"
            height="${spec##*,}"
            "$CHROME" \
              --headless \
              --no-sandbox \
              --disable-gpu \
              --hide-scrollbars \
              --window-size="$width,$height" \
              --screenshot="/tmp/mcb13-overview-$width.png" \
              "file://$HTML#/overview"
            test -s "/tmp/mcb13-overview-$width.png"
          done

          uv run python - <<'PY'
          from pathlib import Path

          expected = {
              "mcb13-overview-1600.png": (1600, 1000),
              "mcb13-capabilities-structured-output-1600.png": (1600, 1000),
              "mcb13-compare-1600.png": (1600, 1000),
              "mcb13-executive-scorecard-1600.png": (1600, 1000),
              "mcb13-executive-quality-1600.png": (1600, 1000),
              "mcb13-executive-speed-1600.png": (1600, 1000),
              "mcb13-executive-size-1600.png": (1600, 1000),
              "mcb13-executive-cost-1600.png": (1600, 1000),
              "mcb13-executive-capabilities-1600.png": (1600, 1000),
              "mcb13-executive-dataset-fit-1600.png": (1600, 1000),
              "mcb13-executive-reliability-1600.png": (1600, 1000),
              "mcb13-overview-1280.png": (1280, 1100),
              "mcb13-overview-1024.png": (1024, 1200),
          }
          for name, (width, height) in expected.items():
              path = Path("/tmp") / name
              data = path.read_bytes()
              assert data[:8] == b"\x89PNG\r\n\x1a\n"
              assert int.from_bytes(data[16:20], "big") == width
              assert int.from_bytes(data[20:24], "big") == height
          PY

      - name: Upload visual review artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mcb13-premium-routes
          path: /tmp/mcb13-*.png
          if-no-files-found: error
