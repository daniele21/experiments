name: MCB-8 capability reporting checks

on:
  pull_request:
    paths:
      - "packages/benchmark-core/**"
      - "experiments/model-capability-benchmark/**"
      - ".github/workflows/mcb8-reporting-checks.yml"
  workflow_dispatch:

jobs:
  reporting:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experiments/model-capability-benchmark

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv

      - name: Sync dependencies
        run: uv sync --extra dev

      - name: Ruff reporting
        run: >
          uv run ruff check
          ../../packages/benchmark-core/src
          ../../packages/benchmark-core/tests
          src
          tests/test_reporting.py
          tests/test_unified_runner.py
          tests/test_runner_manifest.py

      - name: Compile reporting
        run: >
          uv run python -m compileall -q
          src/model_capability_bench/reporting
          src/model_capability_bench/runner
          src/model_capability_bench/cli.py

      - name: Reporting tests
        run: >
          uv run pytest
          tests/test_reporting.py
          tests/test_unified_runner.py
          tests/test_runner_manifest.py
