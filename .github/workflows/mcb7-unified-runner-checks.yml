name: MCB-7 unified runner checks

on:
  pull_request:
    paths:
      - "packages/benchmark-core/**"
      - "experiments/model-capability-benchmark/**"
      - ".github/workflows/mcb7-unified-runner-checks.yml"
  workflow_dispatch:

jobs:
  unified-runner:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experiments/model-capability-benchmark

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv

      - name: Sync dependencies
        run: uv sync --extra dev

      - name: Ruff unified runner
        run: >
          uv run ruff check
          ../../packages/benchmark-core/src
          ../../packages/benchmark-core/tests
          src
          tests/test_unified_runner.py
          tests/test_aggregation.py

      - name: Compile unified runner
        run: >
          uv run python -m compileall -q
          ../../packages/benchmark-core/src/benchmark_core/persistence
          ../../packages/benchmark-core/src/benchmark_core/runner
          src/model_capability_bench/runner

      - name: Core persistence and case identity tests
        run: >
          uv run pytest
          ../../packages/benchmark-core/tests/test_jsonl_and_cases.py

      - name: Unified runner and aggregate tests
        run: >
          uv run pytest
          tests/test_unified_runner.py
          tests/test_aggregation.py
