name: MCB-4 task registry checks

on:
  pull_request:
    paths:
      - "packages/benchmark-core/**"
      - "experiments/model-capability-benchmark/**"
      - ".github/workflows/mcb4-task-registry-checks.yml"
  workflow_dispatch:

jobs:
  tasks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experiments/model-capability-benchmark

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv

      - name: Sync dependencies
        run: uv sync --extra dev

      - name: Ruff task framework
        run: >
          uv run ruff check
          ../../packages/benchmark-core/src
          ../../packages/benchmark-core/tests
          src
          tests
          scripts/task_inspect.py

      - name: Compile task framework
        run: >
          uv run python -m compileall -q
          ../../packages/benchmark-core/src/benchmark_core/tasks
          src
          scripts/task_inspect.py

      - name: Task registry tests
        run: >
          uv run pytest
          ../../packages/benchmark-core/tests/test_tasks.py
          tests/test_tasks.py

      - name: Inspect configured tasks
        run: uv run python scripts/task_inspect.py --tasks all
