name: MCB-2B config runner checks

on:
  pull_request:
    paths:
      - "packages/benchmark-core/**"
      - "experiments/jev-vs-llm/pyproject.toml"
      - "experiments/jev-vs-llm/uv.lock"
      - "experiments/jev-vs-llm/scripts/run_local_matrix.py"
      - "experiments/jev-vs-llm/scripts/run_clm_matrix.py"
      - "experiments/jev-vs-llm/scripts/runner_orchestrator.py"
      - "experiments/jev-vs-llm/tests/test_shared_config_runner_bridge.py"
      - "experiments/model-capability-benchmark/**"
      - ".github/workflows/mcb2b-config-runner-checks.yml"
  workflow_dispatch:

jobs:
  config-runner:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experiments/jev-vs-llm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv

      - name: Frozen dependency sync
        run: uv sync --extra dev --frozen

      - name: Ruff shared core additions
        run: >
          uv run --frozen ruff check
          ../../packages/benchmark-core/src
          ../../packages/benchmark-core/tests
          tests/test_shared_config_runner_bridge.py

      - name: Compile matrix runners
        run: >
          uv run --frozen python -m compileall -q
          scripts/run_local_matrix.py
          scripts/run_clm_matrix.py
          scripts/runner_orchestrator.py

      - name: Config runner focused tests
        run: >
          uv run --frozen pytest --rootdir .
          ../../packages/benchmark-core/tests
          tests/test_clm_runner.py
          tests/test_shared_config_runner_bridge.py
