name: MCB-2C pricing reproducibility checks

on:
  pull_request:
    paths:
      - "packages/benchmark-core/**"
      - "experiments/jev-vs-llm/src/jev_bench/costs.py"
      - "experiments/jev-vs-llm/src/jev_bench/benchmark_data.py"
      - "experiments/jev-vs-llm/tests/test_costs.py"
      - "experiments/jev-vs-llm/tests/test_public_data.py"
      - "experiments/model-capability-benchmark/**"
      - ".github/workflows/mcb2c-pricing-repro-checks.yml"
  workflow_dispatch:

jobs:
  pricing-repro:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experiments/jev-vs-llm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv

      - name: Frozen dependency sync
        run: uv sync --extra dev --frozen

      - name: Ruff pricing reproducibility records
        run: >
          uv run --frozen ruff check
          ../../packages/benchmark-core/src
          ../../packages/benchmark-core/tests
          src/jev_bench/costs.py
          src/jev_bench/benchmark_data.py

      - name: Compile compatibility modules
        run: >
          uv run --frozen python -m compileall -q
          src/jev_bench/costs.py
          src/jev_bench/benchmark_data.py

      - name: Pricing and reproducibility tests
        run: >
          uv run --frozen pytest -c pyproject.toml
          ../../packages/benchmark-core/tests
          tests/test_costs.py
          tests/test_public_data.py
