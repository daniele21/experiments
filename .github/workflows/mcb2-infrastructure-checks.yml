name: MCB-2 shared infrastructure checks

on:
  pull_request:
    paths:
      - "packages/benchmark-core/**"
      - "experiments/jev-vs-llm/pyproject.toml"
      - "experiments/jev-vs-llm/uv.lock"
      - "experiments/jev-vs-llm/src/jev_bench/cli.py"
      - "experiments/jev-vs-llm/src/jev_bench/manifest.py"
      - "experiments/jev-vs-llm/src/jev_bench/runner.py"
      - "experiments/jev-vs-llm/tests/test_shared_infrastructure_bridge.py"
      - "experiments/model-capability-benchmark/**"
      - ".github/workflows/mcb2-infrastructure-checks.yml"
  workflow_dispatch:

jobs:
  infrastructure:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experiments/jev-vs-llm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv

      - name: Frozen dependency sync
        run: uv sync --extra dev --frozen

      - name: Verify production imports
        run: >
          uv run --frozen python -c
          "import benchmark_core; import jev_bench.cli; import jev_bench.manifest; import jev_bench.runner"

      - name: Ruff extracted infrastructure
        run: >
          uv run --frozen ruff check
          ../../packages/benchmark-core/src/benchmark_core/environment.py
          ../../packages/benchmark-core/src/benchmark_core/manifests
          ../../packages/benchmark-core/src/benchmark_core/persistence
          ../../packages/benchmark-core/src/benchmark_core/run_identity.py
          ../../packages/benchmark-core/tests/test_infrastructure.py
          src/jev_bench/manifest.py
          tests/test_shared_infrastructure_bridge.py

      - name: Compile changed Jev modules
        run: >
          uv run --frozen python -m compileall -q
          src/jev_bench/cli.py
          src/jev_bench/runner.py

      - name: Infrastructure and compatibility tests
        run: >
          uv run --frozen pytest
          ../../packages/benchmark-core/tests
          tests/test_characterization_contracts.py
          tests/test_shared_infrastructure_bridge.py
