name: MCB-3 registry checks

on:
  pull_request:
    paths:
      - "packages/benchmark-core/**"
      - "experiments/model-capability-benchmark/models.yaml"
      - "experiments/model-capability-benchmark/.env.example"
      - "experiments/model-capability-benchmark/README.md"
      - "experiments/model-capability-benchmark/scripts/registry_inspect.py"
      - "experiments/model-capability-benchmark/tests/test_registry_config.py"
      - "experiments/model-capability-benchmark/MCB_3_REGISTRY.md"
      - ".github/workflows/mcb3-registry-checks.yml"
  workflow_dispatch:

jobs:
  registry:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experiments/jev-vs-llm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv

      - name: Frozen dependency sync
        run: uv sync --extra dev --frozen

      - name: Ruff registry implementation
        run: >
          uv run --frozen ruff check
          ../../packages/benchmark-core/src
          ../../packages/benchmark-core/tests
          ../model-capability-benchmark/scripts/registry_inspect.py
          ../model-capability-benchmark/tests/test_registry_config.py

      - name: Compile registry code
        run: >
          uv run --frozen python -m compileall -q
          ../../packages/benchmark-core/src/benchmark_core/registry
          ../model-capability-benchmark/scripts/registry_inspect.py

      - name: Registry unit and integration tests
        run: >
          uv run --frozen pytest -c pyproject.toml
          ../../packages/benchmark-core/tests/test_registry.py
          ../model-capability-benchmark/tests/test_registry_config.py

      - name: Resolve local and API models through one CLI
        run: >
          uv run --frozen python
          ../model-capability-benchmark/scripts/registry_inspect.py
          --models qwen3.5-2b-q4km,gpt-5.6-luna

      - name: Preflight selected local model
        env:
          KORGIS_BASE_URL: http://127.0.0.1:1235/v1
        run: >
          uv run --frozen python
          ../model-capability-benchmark/scripts/registry_inspect.py
          --models qwen3.5-2b-q4km
          --preflight
